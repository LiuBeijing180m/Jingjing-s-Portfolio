<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151515">
  <meta name="robots" content="noindex">
  <title>刘晶晶 · 游戏作品集</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #151515;
      color: #f6f3ed;
      --muted: #b9b4ab;
      --edge: #3e3b36;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid #f5c18b;
      outline-offset: 5px;
    }
    .shell { width: min(1056px, calc(100% - 88px)); margin-inline: auto; }
    .header {
      min-height: 102px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--edge);
    }
    .name {
      color: inherit;
      font-family: Georgia, "Songti SC", SimSun, serif;
      font-size: clamp(1.65rem, 3vw, 2.5rem);
      letter-spacing: -.03em;
      text-decoration: none;
    }
    .languages { display: flex; align-items: center; gap: 2px; color: var(--muted); }
    .languages button {
      min-height: 44px;
      padding: 0 10px;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .languages button[aria-pressed="true"] { color: #fff; text-decoration: underline; text-underline-offset: 5px; }
    main { padding-block: 52px 62px; }
    h1 {
      font-size: clamp(1.85rem, 3.7vw, 2.85rem);
      font-weight: 560;
      letter-spacing: -.04em;
      margin: 0 0 26px;
    }
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 42px 48px; }
    .card {
      position: relative;
      display: block;
      isolation: isolate;
      width: 100%;
      aspect-ratio: 16 / 9;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 14px;
      background: #242320;
      color: #fff;
      text-align: left;
      cursor: pointer;
    }
    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 420ms ease;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.55) 27%, transparent 74%);
      opacity: 0;
      transition: opacity 260ms ease;
      pointer-events: none;
    }
    .caption {
      position: absolute;
      z-index: 1;
      inset: auto 18px 18px;
      display: grid;
      gap: 4px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 260ms ease, transform 260ms ease;
      pointer-events: none;
    }
    .caption strong { font-size: clamp(1.1rem, 2.8vw, 1.65rem); line-height: 1.2; }
    .caption small { color: #efebe2; font-size: .85rem; }
    .card:focus-visible::after, .card:focus-visible .caption { opacity: 1; }
    .card:focus-visible .caption { transform: translateY(0); }
    @media (hover: hover) and (pointer: fine) {
      .card:hover img { transform: scale(1.055); }
      .card:hover::after, .card:hover .caption { opacity: 1; }
      .card:hover .caption { transform: translateY(0); }
    }
    .footer { padding: 19px 0 30px; border-top: 1px solid var(--edge); color: var(--muted); font-size: .82rem; }
    dialog {
      max-width: min(720px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      padding: 0;
      border: 1px solid var(--edge);
      border-radius: 16px;
      background: #21201e;
      color: inherit;
    }
    dialog::backdrop { background: rgba(0,0,0,.78); }
    .detail-image { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    .detail-copy { padding: 23px 26px 28px; }
    .detail-copy h2 { margin: 0 0 8px; font-size: 1.6rem; }
    .detail-copy p { margin: 6px 0 0; color: #ddd6ca; line-height: 1.65; }
    .close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #aaa49a;
      border-radius: 50%;
      background: #151515;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    @media (max-width: 640px) {
      .shell { width: calc(100% - 36px); }
      .header { min-height: 75px; }
      main { padding-block: 30px 42px; }
      h1 { margin-bottom: 21px; }
      .projects { grid-template-columns: 1fr; gap: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      .card:hover img { transform: none; }
    }
  </style>
</head>

  <footer class="shell footer" data-copy="footer">作品集 · 访问测试版</footer>

  <dialog id="project-detail" aria-labelledby="detail-title">
    <form method="dialog">
      <button class="close" type="submit" aria-label="关闭" autofocus>&times;</button>
    </form>
    <img class="detail-image" alt="">
    <div class="detail-copy">
      <h2 id="detail-title"></h2>
      <p id="detail-meta" hidden></p>
      <p id="detail-description"></p>
    </div>
  </dialog>

  <script>
    const copy = {
      zh: {
        name: '刘晶晶', heading: '游戏作品', footer: '作品集 · 访问测试版',
        pageTitle: '刘晶晶 · 游戏作品集', close: '关闭',
        preview: '项目详情预览，用于测试从首页打开项目。',
        projects: {
          nirvana: { title: '涅槃' },
          candy: { title: '糖果仙子' },
          cashier: {
            title: '菜鸟收银员', role: '主程序 · 游戏策划',
            date: '2026.07 · 金海豚 Game Jam',
            description: '玩家扮演收银员，在时间限制内算出顾客订单的金额。'
          }
        }
      },
      en: {
        name: 'Jingjing Liu', heading: 'Selected Games', footer: 'Portfolio · Access Test',
        pageTitle: 'Jingjing Liu · Game Portfolio', close: 'Close',
        preview: 'Project preview for testing navigation from the portfolio.',
        projects: {
          nirvana: { title: 'Nirvana' },
          candy: { title: 'Candy Fairy' },
          cashier: {
            title: 'Rookie Cashier', role: 'Lead Programmer · Game Designer',
            date: 'July 2026 · Golden Dolphin Game Jam',
            description: 'Play as a cashier and calculate the total for each customer order before time runs out.'
          }
        }
      }
    };

    const languageButtons = [...document.querySelectorAll('[data-language]')];
    const cards = [...document.querySelectorAll('[data-project]')];
    const detail = document.querySelector('#project-detail');
    const detailImage = detail.querySelector('.detail-image');
    const detailTitle = detail.querySelector('#detail-title');
    const detailMeta = detail.querySelector('#detail-meta');
    const detailDescription = detail.querySelector('#detail-description');
    let language = 'zh';
    let activeCard = null;

    function updateDetail() {
      const project = copy[language].projects[activeCard.dataset.project];
      detailImage.src = activeCard.querySelector('img').src;
      detailTitle.textContent = project.title;
      detailMeta.textContent = [project.role, project.date].filter(Boolean).join(' / ');
      detailMeta.hidden = !detailMeta.textContent;
      detailDescription.textContent = project.description || copy[language].preview;
    }

    function updateLanguage(nextLanguage) {
      language = nextLanguage;
      const words = copy[language];
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      document.title = words.pageTitle;
      document.querySelectorAll('[data-copy]').forEach(element => {
        element.textContent = words[element.dataset.copy];
      });
      languageButtons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.language === language));
      });
      cards.forEach(card => {
        const project = words.projects[card.dataset.project];
        card.querySelector('[data-project-title]').textContent = project.title;
        const role = card.querySelector('[data-project-role]');
        const date = card.querySelector('[data-project-date]');
        if (role) role.textContent = project.role;
        if (date) date.textContent = project.date;
      });
      detail.querySelector('.close').setAttribute('aria-label', words.close);
      if (activeCard) updateDetail();
    }

    languageButtons.forEach(button => {
      button.addEventListener('click', () => updateLanguage(button.dataset.language));
    });
    cards.forEach(card => {
      card.addEventListener('click', () => {
        activeCard = card;
        updateDetail();
        detail.showModal();
      });
    });
    detail.addEventListener('click', event => {
      if (event.target === detail) {
        const box = detail.getBoundingClientRect();
        const outside = event.clientX < box.left || event.clientX > box.right
          || event.clientY < box.top || event.clientY > box.bottom;
        if (outside) detail.close();
      }
    });
    detail.addEventListener('close', () => {
      if (activeCard) activeCard.focus({ preventScroll: true });
      activeCard = null;
    });
  </script>
